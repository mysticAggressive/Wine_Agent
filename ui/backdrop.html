<!-- Full-page "marbled swirl" backdrop: domain-warped sine field, drawn at 1/8 of the
     window's resolution and scaled up (smooth and cheap). Loaded in a components.html
     iframe that ui/styles.py pins behind the whole app. -->
<style>
  html, body { margin: 0; height: 100%; background: #140d12; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
</style>
<canvas id="bd"></canvas>
<script>
(() => {
  const INTENSITY = 0.5, SPEED = 1, SCALE = 8, FPS = 30;
  const BG = [20, 13, 18], DEEP = [70, 12, 32], WINE = [158, 31, 69];
  const cv = document.getElementById("bd"), c = cv.getContext("2d");
  let img, w = 0, h = 0, t = 0;
  function resize() {
    w = Math.max(16, Math.ceil(innerWidth / SCALE)); h = Math.max(16, Math.ceil(innerHeight / SCALE));
    cv.width = w; cv.height = h; img = c.createImageData(w, h);
  }
  const base = BG.map((b, i) => b + (DEEP[i] - b) * 0.6);
  function draw() {
    const d = img.data, aspect = w / h, tt = t * 0.15;
    for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
      let x = (px / w) * 2 * aspect, y = (py / h) * 2;
      for (let i = 0; i < 3; i++) {  // each pass folds the field again
        const nx = x + 0.6 * Math.sin(y * 1.7 + tt * (i + 1)) + 0.3 * Math.cos(x * 0.9 - tt);
        y += 0.6 * Math.cos(x * 1.3 - tt * (i + 0.5)); x = nx;
      }
      const n = 0.5 + 0.5 * Math.sin(x * 1.2 + y * 1.1);
      const k = Math.pow(n, 2.2) * INTENSITY;
      const glint = Math.pow(Math.max(0, n - 0.93) / 0.07, 2) * 0.35 * INTENSITY;
      const o = (py * w + px) * 4;
      d[o] = base[0] + (WINE[0] - base[0]) * k + glint * 60;
      d[o + 1] = base[1] + (WINE[1] - base[1]) * k + glint * 45;
      d[o + 2] = base[2] + (WINE[2] - base[2]) * k + glint * 20;
      d[o + 3] = 255;
    }
    c.putImageData(img, 0, 0);
  }
  addEventListener("resize", () => { resize(); draw(); });
  resize(); draw();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let last = 0;
  (function frame(now) {
    if (now - last >= 1000 / FPS) { t += (SPEED * (now - last || 16)) / 1000; last = now; draw(); }
    requestAnimationFrame(frame);
  })(0);
})();
</script>
